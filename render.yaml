# Render Blueprint：连接 GitHub 后一键创建「免费 Web 服务 + 免费 PostgreSQL」
services:
  - type: web
    name: aitest
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DEBUG
        value: "false"
      - key: ALLOW_PRIVATE_TARGET
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: REQUEST_TIMEOUT
        value: "5"
      # 数据库连接串由 Render 注入，容器重启/重新部署不会丢数据
      - key: DATABASE_URL
        fromDatabase:
          name: aitest-db
          property: connectionString

databases:
  - name: aitest-db
    plan: free
    region: singapore
    databaseName: aitest
    user: aitest
