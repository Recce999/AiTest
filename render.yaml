# Render Blueprint：连接 GitHub 后一键创建免费 Web 服务
#
# 说明：免费 PostgreSQL 会让 Blueprint 要求绑定信用卡，这里不启用，
# 直接用容器内 SQLite。重新部署会清空数据（演示够用）；
# 若需持久化，在 Render 控制台手动加一个数据库服务，并把它的
# Internal Database URL 填到本服务的 DATABASE_URL 环境变量即可。
services:
  - type: web
    name: aitest
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DEBUG
        value: "false"
      - key: ALLOW_PRIVATE_TARGET
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: REQUEST_TIMEOUT
        value: "5"
      - key: DATABASE_URL
        value: sqlite:///./aitest.db
